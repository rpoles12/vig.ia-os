<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">7set.dev neon</title>
  <desc id="desc">Aplicacao luminosa do wordmark 7set.dev para telas e cartazes.</desc>
  <defs>
    <filter id="neon" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" fill="#08070C"/>
  <text x="800" y="350" text-anchor="middle"
        font-family="Space Grotesk, Arial, sans-serif"
        font-size="300" font-weight="700" letter-spacing="-13"
        fill="#E8DCFF" stroke="#A66BFF" stroke-width="2"
        filter="url(#neon)">7set.dev</text>
</svg>
