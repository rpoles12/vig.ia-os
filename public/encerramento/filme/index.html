<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VIG.IA · Reconstituição do incidente</title><link rel="stylesheet" href="estilo.css"><link rel="stylesheet" href="integrado.css"></head>
<body class="embedded">
<header><div><span class="brand">VIG.IA</span><span class="divider">/</span><span>RECONSTITUIÇÃO DO INCIDENTE</span></div><span class="preview-tag">MEMÓRIA RECUPERADA · 100%</span></header>
<main>
 <section id="player" aria-label="Reconstituição narrada">
 <div id="viewport"><div id="stage"><div id="scenes"></div><div class="film-header"><span>VIG.IA <b>REGISTROS RECUPERADOS</b></span><span>INTEGRIDADE <strong>100%</strong></span></div><div id="subtitle" aria-live="off"></div></div>
   <button id="start" class="start"><span class="play-disc">▶</span><strong>Reproduzir reconstituição</strong><small>26 quadros · narração contínua · 4min15s</small></button>
   <div id="error" role="alert" hidden></div>
  </div>
  <div class="controls">

  </div>
 </section>
 <section class="review"><div><h1>Reconstituição do incidente</h1><p>Narração contínua · duração aproximada: 4min15s</p></div><button id="transcript-toggle" aria-expanded="false">Ler narração</button></section>

 <section id="transcript" hidden aria-label="Transcrição da narração"></section>
</main>
